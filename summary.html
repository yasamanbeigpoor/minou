<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minou summary</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #fff; }
    .print-wrap { max-width: 760px; margin: 0 auto; padding: 24px; }
    .print-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; color: #6a5ae0; font: 600 18px 'Fredoka', sans-serif; }
  </style>
</head>
<body>
  <div class="print-wrap"><div class="print-brand" id="brand"></div><div id="out"></div></div>
  <script type="module">
    // Renders one module summary for printing. ?m=class1.m1  &fa=1 adds Persian pronunciation.
    import { loadAll, moduleByKey } from './js/data.js';
    import { renderSummary } from './js/summary.js';
    import { minouSVG } from './js/minou.js';
    const q = new URLSearchParams(location.search);
    document.documentElement.classList.toggle('no-fa', q.get('fa') !== '1');
    document.documentElement.dataset.theme = 'light';
    await loadAll();
    const m = moduleByKey(q.get('m'));
    const brand = document.getElementById('brand');
    brand.append(minouSVG({ size: 40, mood: 'happy' }), 'minou');
    document.getElementById('out').append(renderSummary(m, { interactive: false }));
    await document.fonts.ready;
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
